logLevel: info
writeQueueSize: 128
udpReadBufferSize: 4194304

# This MediaMTX instance is deliberately separate from the HDMI KVM instance.
api: true
apiAddress: 127.0.0.1:9998
rtsp: true
rtspAddress: :8555
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8891
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8191
webrtcLocalTCPAddress: :8191
webrtcAdditionalHosts: []

pathDefaults:
  source: publisher

paths:
  camera:
    source: udp+rtp://127.0.0.1:5006
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=RK3588 CSI Camera
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5006 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
      a=recvonly
